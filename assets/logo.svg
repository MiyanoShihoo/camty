<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141824"/>
      <stop offset="1" stop-color="#0b0e16"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e74c3c"/>
      <stop offset="1" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d76e"/>
      <stop offset="1" stop-color="#d4a017"/>
    </linearGradient>
  </defs>

  <!-- 蜂巢六边形：交战指挥单元 -->
  <polygon points="256,32 432,134 432,378 256,480 80,378 80,134"
           fill="url(#bg)" stroke="url(#red)" stroke-width="14"/>

  <!-- 靶环：测绘→验证→利用 的交战环 -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#2a3142" stroke-width="18"/>
  <circle cx="256" cy="256" r="105" fill="none" stroke="#3a4356" stroke-width="18"/>
  <circle cx="256" cy="256" r="60"  fill="none" stroke="url(#red)" stroke-width="18"/>

  <!-- 扫描中的人机界面节点 -->
  <circle cx="256" cy="256" r="20" fill="url(#gold)"/>

  <!-- 扫描扇面：突破路径 -->
  <path d="M 256 256 L 256 96 A 160 160 0 0 1 394 176 Z"
        fill="url(#red)" opacity="0.28"/>
  <line x1="256" y1="256" x2="256" y2="96"  stroke="#e74c3c" stroke-width="6"/>
  <line x1="256" y1="256" x2="394" y2="176" stroke="#e74c3c" stroke-width="6"/>

  <!-- 血滴角标：红队 -->
  <path d="M 402 96 c -22 30 -34 48 -34 62 a 34 34 0 0 0 68 0 c 0 -14 -12 -32 -34 -62 Z"
        fill="url(#red)" stroke="#141824" stroke-width="6"/>
</svg>
